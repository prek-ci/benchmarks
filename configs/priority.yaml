exclude: ^\.pre-commit-config\.yaml$

priorities:
  trim: 0
  eof: 10
  line-endings: 20
  bom: 30
  checks: 40

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: trim
      - id: end-of-file-fixer
        priority: eof
      - id: mixed-line-ending
        priority: line-endings
      - id: fix-byte-order-marker
        priority: bom
      - id: check-json
        priority: checks
      - id: check-yaml
        priority: checks
      - id: check-toml
        priority: checks
      - id: check-xml
        priority: checks
      - id: check-executables-have-shebangs
        priority: checks
      - id: detect-private-key
        priority: checks
      - id: check-case-conflict
        priority: checks
      - id: check-merge-conflict
        priority: checks
      - id: check-symlinks
        priority: checks
